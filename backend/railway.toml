[build]
  builder = "nixpacks"
  buildCommand = "npm ci --omit=dev"

[deploy]
  startCommand = "npm run start:production"
  healthcheckPath = "/health"
  healthcheckTimeout = 100
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10

[env]
  NODE_ENV = "production"
  PORT = { default = "3001" }

# PostgreSQL Database
[services.postgres]
  type = "postgresql"

# Redis Cache
[services.redis]
  type = "redis" 