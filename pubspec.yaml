name: durusuna_mobile
description: A real-time school classroom chat application built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.7
  cached_network_image: ^3.2.3
  photo_view: ^0.14.0
  flutter_staggered_animations: ^1.1.1
  lottie: ^2.6.0
  
  # State Management
  flutter_riverpod: ^2.3.6
  riverpod_annotation: ^2.1.1
  
  # Networking & Real-time
  dio: ^5.3.2
  socket_io_client: ^2.0.3+1
  connectivity_plus: ^4.0.2
  
  # Storage & Caching
  shared_preferences: ^2.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  
  # Media & Files
  image_picker: ^1.0.2
  file_picker: ^8.1.2
  permission_handler: ^12.0.1
  video_player: ^2.7.0
  mime: ^1.0.4
  
  # Utils
  intl: ^0.18.1
  uuid: ^3.0.7
  timeago: ^3.5.0
  url_launcher: ^6.1.12
  package_info_plus: ^4.0.2
  
  # Authentication
  jwt_decoder: ^2.0.1
  crypto: ^3.0.3
  
  # JSON serialization (moved from dev_dependencies)
  json_annotation: ^4.8.1
  
  # Push Notifications - TEMPORARILY DISABLED FOR TESTING
  # firebase_core: ^3.15.1
  # firebase_messaging: ^15.1.0
  # flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  riverpod_generator: ^2.2.3
  hive_generator: ^2.0.0
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/
  
